[project]
name = "ai-agent-orchestration-poc"
version = "0.1.0"
description = "Conversational agent (Google ADK) that interprets requests, validates tool arguments deterministically and orchestrates tool execution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk[redis]>=2.14.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
